name: genesis-bootstrap

# The one-time genesis ceremony for the pull request that replaces the factory trust root.
#
# It is deliberately manual. The three inputs below are the trust anchor and none of them lives
# in the repository: a human reads the genesis diff, computes the two hashes, names the exact
# commit, and dispatches this workflow. A candidate that edits the verifier or the manifest
# changes its hash, and the pinned value then fails closed.
#
# This workflow authorizes nothing by itself. It produces evidence for the human who performs the
# one-time merge. No merge path in this repository reads its output, so an ordinary trust-root
# change can never route around the deterministic guards by invoking this exception.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit being authorized
        required: true
      verifier_sha256:
        description: SHA-256 of harness/bootstrap_verify.py as reviewed
        required: true
      manifest_sha256:
        description: SHA-256 of .factory/bootstrap/genesis.json as reviewed
        required: true

permissions:
  contents: read

jobs:
  genesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''
      - name: Verify genesis trust root
        run: |
          python harness/bootstrap_verify.py \
            --expect-candidate "${{ inputs.candidate_sha }}" \
            --expect-verifier "${{ inputs.verifier_sha256 }}" \
            --expect-manifest "${{ inputs.manifest_sha256 }}" \
            --output genesis-authorization.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis-authorization
          path: genesis-authorization.json
