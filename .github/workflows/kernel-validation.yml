name: kernel-validation

on:
  push:
    branches:
      - validation/df2-kernel-v1

permissions:
  contents: read

env:
  CANDIDATE_SHA: d75de1ab9808a7ed7941156a40b5706034e5e4b0

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/df2-factory-kernel-v1
          fetch-depth: 1
      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install locked backend dependencies
        working-directory: app/backend
        run: uv sync --frozen --all-extras
      - name: Install locked frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile
      - name: Compile kernel
        run: python -m compileall -q factory_kernel
      - name: Run kernel factory tests
        run: python -m unittest discover -s tests/factory -p 'test_factory_kernel*.py'
      - name: Canonical quick gate
        run: python harness/ci.py --quick
