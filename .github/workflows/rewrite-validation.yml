name: rewrite-validation

on:
  push:
    branches: [validation/df2-rewrite-v1]

permissions:
  contents: read

env:
  CANDIDATE_SHA: 077b0069ca4ae9077b481ee3b6f260a91536f0c1

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
      - name: Probe real Claude Code worker interface
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          claude --help > /tmp/claude-help.txt
          for flag in --bare --permission-mode --tools --strict-mcp-config --mcp-config --disable-slash-commands --add-dir --allowedTools; do
            if ! grep -F -- "$flag" /tmp/claude-help.txt >/dev/null; then
              echo "CLAUDE_INTERFACE_MISSING $flag"
              cat /tmp/claude-help.txt
              exit 1
            fi
          done
          echo "CLAUDE_INTERFACE_OK"
      - name: Install locked backend dependencies
        working-directory: app/backend
        run: uv sync --frozen --all-extras
      - name: Install locked frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile
      - name: Compile repo-owned kernel
        run: python -m compileall -q factory_kernel
      - name: Validate kernel configuration
        run: python -m factory_kernel config-check
      - name: Factory tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m unittest discover -s tests/factory -p 'test_*.py'
      - name: Canonical quick gate
        run: python harness/ci.py --quick
      - name: Factory trust-root mutations
        run: python harness/factory_mutations/run.py
