name: rewrite-validation

on:
  push:
    branches: [validation/df2-rewrite-v1]

permissions:
  contents: read

env:
  CANDIDATE_SHA: 94144d19ccc0234fa9327d3d01d30bea5d762364

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''
      - name: Probe pinned Claude Code worker interface
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.245
          test "$(claude --version)" = "2.1.245 (Claude Code)"
          claude --help > /tmp/claude-help.txt
          for flag in --bare --permission-mode --tools --strict-mcp-config --mcp-config --disable-slash-commands --add-dir --allowedTools; do
            grep -F -- "$flag" /tmp/claude-help.txt >/dev/null || {
              echo "CLAUDE_INTERFACE_MISSING $flag"
              exit 1
            }
          done
          echo "CLAUDE_INTERFACE_OK version=2.1.245"
      - name: Install locked backend dependencies
        working-directory: app/backend
        run: uv sync --frozen --all-extras
      - name: Install locked frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile
      - name: Compile repo-owned kernel
        run: python -m compileall -q factory_kernel
      - name: Validate kernel configuration
        run: python -m factory_kernel config-check
      - name: Factory tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m unittest discover -s tests/factory -p 'test_*.py'
      - name: Canonical quick gate
        run: python harness/ci.py --quick
      - name: Independent core holdout
        run: python .factory/holdout/run.py
      - name: Independent citation holdout
        run: python .factory/holdout/citations.py
      - name: Integrated application and trust-root mutations
        run: python harness/mutations/run.py
