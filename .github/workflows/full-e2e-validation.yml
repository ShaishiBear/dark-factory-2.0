name: full-e2e-validation

on:
  push:
    branches: [validation/df2-full-e2e-v1]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 94144d19ccc0234fa9327d3d01d30bea5d762364

jobs:
  full-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_factory_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_factory_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact rewrite candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''

      - name: Setup uv 0.12.5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''

      - name: Install locked backend dependencies
        working-directory: app/backend
        run: uv sync --frozen --all-extras

      - name: Install locked frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      - name: Smoke corrected full-gate service startup
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/dark_factory_validation'
          export OPENROUTER_API_KEY='startup-smoke-not-used'
          export JWT_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export DARK_FACTORY_E2E_EMAIL='dark-factory-e2e@localhost.invalid'
          export DARK_FACTORY_E2E_PASSWORD='startup-smoke-only'
          export SEED_ENABLE='false'

          python harness/serve.py --port 8123 --with-frontend > /tmp/full-gate-smoke.log 2>&1 &
          serve_pid=$!
          cleanup() {
            kill "$serve_pid" 2>/dev/null || true
            wait "$serve_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          healthy=0
          for _ in $(seq 1 90); do
            if ! kill -0 "$serve_pid" 2>/dev/null; then
              cat /tmp/full-gate-smoke.log
              echo "FULL_RUNTIME_SMOKE_FAILED server exited early"
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8123/api/health | grep -qi 'ok'; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1 || {
            cat /tmp/full-gate-smoke.log
            echo "FULL_RUNTIME_SMOKE_FAILED backend health timeout"
            exit 1
          }

          frontend_file='/tmp/dark-factory-frontend-8123.port'
          test -s "$frontend_file" || {
            cat /tmp/full-gate-smoke.log
            echo "FULL_RUNTIME_SMOKE_FAILED frontend rendezvous missing"
            exit 1
          }
          frontend_port="$(cat "$frontend_file")"
          curl -fsS "http://127.0.0.1:${frontend_port}/" >/dev/null || {
            cat /tmp/full-gate-smoke.log
            echo "FULL_RUNTIME_SMOKE_FAILED frontend unreachable"
            exit 1
          }
          echo "FULL_RUNTIME_SMOKE_OK backend=8123 frontend=${frontend_port}"

      - name: Check only external E2E credentials
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          failed=0
          for name in OPENROUTER_API_KEY SUPADATA_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "FULL_E2E_PREFLIGHT_MISSING $name"
              failed=1
            else
              echo "FULL_E2E_PREFLIGHT_PRESENT $name"
            fi
          done
          test "$failed" -eq 0 || {
            echo "FULL_E2E_PREFLIGHT_INCOMPLETE"
            exit 1
          }
          echo "FULL_E2E_PREFLIGHT_OK"

      - name: Install pinned browser runtime
        run: |
          npm install -g agent-browser@0.35.0
          agent-browser install --with-deps
          agent-browser --help >/dev/null
          echo "AGENT_BROWSER_READY version=0.35.0"

      - name: Create disposable validation environment
        shell: bash
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          e2e_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$e2e_password"
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/dark_factory_validation"
            echo "JWT_SECRET=$jwt_secret"
            echo "DARK_FACTORY_E2E_EMAIL=dark-factory-e2e@localhost.invalid"
            echo "DARK_FACTORY_E2E_PASSWORD=$e2e_password"
            echo "DARK_FACTORY_E2E_BOOTSTRAP=1"
            echo "SEED_ENABLE=false"
          } >> "$GITHUB_ENV"
          echo "DISPOSABLE_E2E_ENV_READY"

      - name: Run canonical full harness
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          set -o pipefail
          python harness/ci.py 2>&1 | tee full-harness.log
