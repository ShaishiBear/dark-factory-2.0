name: rewrite-operational-preflight

on:
  push:
    branches: [validation/df2-operational-preflight-v1]

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  CANDIDATE_SHA: 3af850a0b03f89a52aa24ae25bc5f8680d323e84

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact rewrite candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''

      - name: Probe pinned Claude worker
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.245
          test "$(claude --version)" = "2.1.245 (Claude Code)"
          claude --help > /tmp/claude-help.txt
          for flag in --bare --permission-mode --tools --strict-mcp-config --mcp-config --disable-slash-commands --add-dir --allowedTools; do
            grep -F -- "$flag" /tmp/claude-help.txt >/dev/null || {
              echo "CLAUDE_INTERFACE_MISSING $flag"
              exit 1
            }
          done
          echo "CLAUDE_INTERFACE_OK version=2.1.245"

      - name: Probe pinned GitHub-hosted browser runtime
        run: |
          npm install -g agent-browser@0.35.0
          agent-browser install --with-deps
          agent-browser --help >/dev/null
          echo "AGENT_BROWSER_INTERFACE_OK version=0.35.0"

      - name: Ensure factory control labels exist
        shell: bash
        run: |
          labels="$(gh label list -R "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name')"
          for label in \
            factory:accepted \
            factory:rejected \
            factory:rate-limited \
            factory:in-progress \
            factory:needs-review \
            factory:needs-fix \
            factory:needs-human \
            factory:stop
          do
            if grep -Fx -- "$label" <<<"$labels" >/dev/null; then
              echo "LABEL_PRESENT $label"
            else
              gh label create "$label" -R "$GITHUB_REPOSITORY" --color 5319E7 --description "Dark Factory control state"
              echo "LABEL_CREATED $label"
            fi
          done

      - name: Check current unattended-worker prerequisites
        shell: bash
        run: |
          failed=0
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')" != "true" ]; then
            echo "GITHUB_ISSUES_DISABLED"
            failed=1
          else
            echo "GITHUB_ISSUES_ENABLED"
          fi

          if [ "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')" != "true" ]; then
            echo "MAIN_BRANCH_UNPROTECTED"
            failed=1
          else
            echo "MAIN_BRANCH_PROTECTED"
          fi

          labels="$(gh label list -R "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name')"
          for label in \
            factory:accepted \
            factory:rejected \
            factory:rate-limited \
            factory:in-progress \
            factory:needs-review \
            factory:needs-fix \
            factory:needs-human \
            factory:stop
          do
            if grep -Fx -- "$label" <<<"$labels" >/dev/null; then
              echo "LABEL_PRESENT $label"
            else
              echo "LABEL_MISSING $label"
              failed=1
            fi
          done

          for name in ANTHROPIC_API_KEY OPENROUTER_API_KEY SUPADATA_API_KEY
          do
            if [ -n "${!name:-}" ]; then
              echo "SECRET_PRESENT $name"
            else
              echo "SECRET_MISSING $name"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "OPERATIONAL_PREFLIGHT_INCOMPLETE"
            exit 1
          fi
          echo "OPERATIONAL_PREFLIGHT_OK"
