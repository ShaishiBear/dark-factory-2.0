name: dark-factory-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: dark-factory-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quick-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''

      - name: Validate kernel configuration
        run: python -m factory_kernel config-check

      - name: Install locked backend dependencies
        working-directory: app/backend
        run: uv sync --frozen --all-extras

      - name: Install locked frontend dependencies
        working-directory: app/frontend
        run: bun install --frozen-lockfile

      - name: Deterministic security guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/factory_security.py --pr "${{ github.event.pull_request.number }}"

      - name: Canonical quick gate
        run: python harness/ci.py --quick
