name: genesis-ladder

# Exact-head validation ladder for the genesis candidate, driven by the pinned external driver.
#
# This workflow lives outside the candidate branch on purpose. The driver reports its own digest
# into its result, but a tampered driver would report the expected value, so that field is
# corroborating only. The binding check is the one below: this workflow computes the digests
# itself and refuses to run a driver or recipe that does not match the pinned values.
#
# EXPECTED_DRIVER_SHA256 / EXPECTED_RECIPE_SHA256 are empty for a provisional run, which prints
# the observed digests so a human can pin them. For the authoritative run they are filled in and
# the job fails closed on any mismatch.

on:
  push:
    branches: [validation/df2-genesis-provisional-2]

permissions:
  contents: read

env:
  CANDIDATE_SHA: c15227a5632980e0ba1968b94bcf539e605fcee1
  EXPECTED_DRIVER_SHA256: ''
  EXPECTED_RECIPE_SHA256: ''

jobs:
  ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
          persist-credentials: false

      - name: Assert and publish exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$head" = "$CANDIDATE_SHA"
          echo "EXACT_HEAD_OK $head"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''

      # Dependencies are no longer installed here: each stage rebuilds them inside its own
      # isolated worktree, so nothing this job does to the main checkout can reach a stage.

      - name: Bind the validation driver and recipe
        shell: bash
        run: |
          set -euo pipefail
          driver="$(sha256sum harness/genesis_validate.py | cut -d' ' -f1)"
          recipe="$(sha256sum harness/genesis-recipe.json | cut -d' ' -f1)"
          echo "DRIVER_SHA256 $driver"
          echo "RECIPE_SHA256 $recipe"
          if [ -n "$EXPECTED_DRIVER_SHA256" ]; then
            test "$driver" = "$EXPECTED_DRIVER_SHA256" || {
              echo "LADDER_REFUSED validation driver does not match the pinned digest"; exit 1; }
            test "$recipe" = "$EXPECTED_RECIPE_SHA256" || {
              echo "LADDER_REFUSED validation recipe does not match the pinned digest"; exit 1; }
            echo "LADDER_PINS_OK"
          else
            echo "LADDER_PINS_PROVISIONAL digests printed for review, not asserted"
          fi

      - name: Run the pinned validation driver
        run: |
          python harness/genesis_validate.py \
            --repo . --commit "$CANDIDATE_SHA" \
            --recipe harness/genesis-recipe.json \
            --log-dir validation-logs \
            --work-dir "$RUNNER_TEMP/genesis-stages" \
            --output validation-result.json

      - name: Publish the structured result
        if: always()
        shell: bash
        run: |
          echo '--- validation-result.json ---'
          cat validation-result.json || echo '(no result produced)'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genesis-validation
          path: |
            validation-result.json
            validation-logs/
