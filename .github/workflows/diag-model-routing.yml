name: diag-model-routing

# Throwaway diagnostic. Draft PR only; never merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''
      - name: Install pinned CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.245 && claude --version

      - name: Probe 4 - corrected base URL
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          mkdir -p /tmp/art
          for model in z-ai/glm-5.3-flash deepseek/deepseek-v4-pro-0813 anthropic/claude-haiku-4.5; do
            echo "=============== $model (no tools)"
            timeout 150 claude --bare -p "Reply with exactly the word OK and nothing else." --model "$model" --permission-mode dontAsk --tools "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json > /tmp/o.json 2>/tmp/e.txt
            echo "rc=$?"; python3 -c "import json;d=json.load(open('/tmp/o.json'));print('is_error:',d.get('is_error'),'| result:',str(d.get('result'))[:200],'| api_ms:',d.get('duration_api_ms'),'| usage in:',d.get('usage',{}).get('input_tokens'))"
          done
          echo "=============== glm with worker tools + add-dir, a Read of a real file"
          echo "hello from the checkout" > /tmp/art/note.txt
          timeout 150 claude --bare -p "Read the file /tmp/art/note.txt and reply with its exact contents." --model z-ai/glm-5.3-flash --permission-mode dontAsk --tools "Read,Glob,Grep,Write,Edit" --allowedTools "Read,Glob,Grep,Write,Edit" --add-dir /tmp/art --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json > /tmp/o.json 2>/tmp/e.txt
          echo "rc=$?"; python3 -c "import json;d=json.load(open('/tmp/o.json'));print('is_error:',d.get('is_error'),'| result:',str(d.get('result'))[:200],'| turns:',d.get('num_turns'))"
          echo "=============== stderr sample"; head -c 400 /tmp/e.txt; echo
