name: diag-model-routing

# Throwaway diagnostic. Runs the pinned Claude Code CLI against OpenRouter the way the kernel
# does and prints the real outcome the provider boundary hides. Draft PR only; never merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''
      - name: Install pinned CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.245 && claude --version && (claude --help | grep -i -E 'debug|settings|max-context|output-format' || true)

      - name: CLI probes mirroring the kernel
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api/v1
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          mkdir -p /tmp/art
          python3 - <<'PY'
          small = "Reply with exactly the word OK and nothing else."
          big = small + "\n\n" + ("Context filler line for the diagnostic. " * 400 + "\n") * 8  # ~130k chars? no: ~ 8*400*40 = 128k
          open("/tmp/small.txt", "w").write(small)
          open("/tmp/big.txt", "w").write(big[:60000])
          print("big prompt chars:", len(big[:60000]))
          PY
          run() {  # name, prompt-file, extra args...
            local name="$1"; local pf="$2"; shift 2
            echo "=============== $name"
            timeout 180 claude --bare -p "$(cat "$pf")" --permission-mode dontAsk --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json "$@" > /tmp/out.json 2> /tmp/err.txt
            echo "rc=$?"
            echo "--- stdout (json, first 1200 chars):"; head -c 1200 /tmp/out.json; echo
            echo "--- stderr (first 800 chars):"; head -c 800 /tmp/err.txt; echo
          }
          run "A glm small, no tools" /tmp/small.txt --model z-ai/glm-5.3-flash --tools ""
          run "B glm big(60k chars), no tools" /tmp/big.txt --model z-ai/glm-5.3-flash --tools ""
          run "C haiku big(60k chars), no tools" /tmp/big.txt --model anthropic/claude-haiku-4.5 --tools ""
          run "D glm small, worker tools + add-dir" /tmp/small.txt --model z-ai/glm-5.3-flash --tools "Read,Glob,Grep,Write,Edit" --allowedTools "Read,Glob,Grep,Write,Edit" --add-dir /tmp/art
          echo "=============== E glm big with CLAUDE_CODE_MAX_CONTEXT_TOKENS=200000"
          CLAUDE_CODE_MAX_CONTEXT_TOKENS=200000 run "E" /tmp/big.txt --model z-ai/glm-5.3-flash --tools ""
          echo "=============== F glm big with modelOverrides via --settings"
          run "F" /tmp/big.txt --model z-ai/glm-5.3-flash --tools "" --settings '{"modelOverrides":{"z-ai/glm-5.3-flash":{"contextWindow":200000}}}'
          echo "=============== G deepseek big, no tools"
          run "G" /tmp/big.txt --model deepseek/deepseek-v4-pro-0813 --tools ""
          echo "=============== debug logs present?"; ls -la ~/.claude/debug 2>/dev/null | tail -3; for f in ~/.claude/debug/*.log; do [ -f "$f" ] && grep -i -E '"status":|error|404|count_tokens' "$f" | head -20; done; true
