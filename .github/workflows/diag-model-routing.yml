name: diag-model-routing

# Throwaway diagnostic. Draft PR only; never merged.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''
      - name: Install pinned CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.245 && claude --version

      - name: Probe 3
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          redact() { sed -E 's/sk-or-[A-Za-z0-9_-]+/[REDACTED]/g; s/Bearer [A-Za-z0-9_-]+/Bearer [REDACTED]/g' | cut -c1-400; }
          echo "=============== 1. glm via ANTHROPIC_AUTH_TOKEN, debug file"
          ANTHROPIC_BASE_URL=https://openrouter.ai/api/v1 ANTHROPIC_AUTH_TOKEN="$KEY" timeout 120 claude --bare -p "Reply OK" --model z-ai/glm-5.3-flash --permission-mode dontAsk --tools "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json --debug-file /tmp/d1.log > /tmp/o1.json 2>/dev/null
          echo "rc=$?"; python3 -c "import json;d=json.load(open('/tmp/o1.json'));print('result:',str(d.get('result'))[:600])"
          echo "--- debug lines (status/error/http/model):"; grep -i -E 'status|error|http|model|401|403|404|400' /tmp/d1.log | redact | head -40
          echo "=============== 2. glm via ANTHROPIC_API_KEY"
          ANTHROPIC_BASE_URL=https://openrouter.ai/api/v1 ANTHROPIC_API_KEY="$KEY" timeout 120 claude --bare -p "Reply OK" --model z-ai/glm-5.3-flash --permission-mode dontAsk --tools "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json --debug-file /tmp/d2.log > /tmp/o2.json 2>/dev/null
          echo "rc=$?"; python3 -c "import json;d=json.load(open('/tmp/o2.json'));print('is_error:',d.get('is_error'),'result:',str(d.get('result'))[:600])"
          echo "--- debug lines:"; grep -i -E 'status|error|http|401|403|404|400' /tmp/d2.log | redact | head -30
          echo "=============== 3. haiku via ANTHROPIC_API_KEY"
          ANTHROPIC_BASE_URL=https://openrouter.ai/api/v1 ANTHROPIC_API_KEY="$KEY" timeout 120 claude --bare -p "Reply OK" --model anthropic/claude-haiku-4.5 --permission-mode dontAsk --tools "" --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands --output-format json > /tmp/o3.json 2>/dev/null
          echo "rc=$?"; python3 -c "import json;d=json.load(open('/tmp/o3.json'));print('is_error:',d.get('is_error'),'result:',str(d.get('result'))[:300])"
          echo "=============== 4. curl ?beta=true with x-api-key / bearer"
          for auth in "x-api-key: $KEY" "Authorization: Bearer $KEY"; do
            curl -sS -o /tmp/r.json -w 'http=%{http_code}\n' -X POST 'https://openrouter.ai/api/v1/messages?beta=true' -H "$auth" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d '{"model":"z-ai/glm-5.3-flash","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}'; head -c 200 /tmp/r.json | redact; echo
          done
          echo "=============== 5. env the CLI honours?"; claude --help 2>/dev/null | grep -i -E 'api-key|auth|base-url|bearer' | head -5; true
