name: dark-factory-main-regression

# Periodic full-harness regression on main.
#
# Validation and post-merge already run the full harness inside the worker dispatch that
# performs an autonomous merge. Nothing re-ran it on main afterwards: a maintainer merge lands
# on the head-based quick gate only, and an external drift (a fixture video, a model, an API,
# a runner image) would go unnoticed until the next autonomous cycle. This job runs the same
# full gate the merge authority uses, on current main, once a day, and files ONE issue for a
# failure so it flows through ordinary triage. It never merges, never labels factory:*, and
# never applies factory:needs-human except on a second consecutive failure (FACTORY_RULES 7).
#
# Toolchain pins, the postgres service and the disposable validation environment are copied
# verbatim from dark-factory-worker.yml; tests/factory assert the two files agree.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dark-factory-main-regression
  cancel-in-progress: false

jobs:
  regression:
    if: github.repository == 'ShaishiBear/dark-factory-2.0'
    runs-on: ubuntu-24.04
    # NOT A GUESS, AND NOT A LITERAL EITHER. This job is the outermost wrapper of the full
    # ladder, so it is the `main-regression-job` scope in harness/budgets.json: the ladder's
    # own 10020 s budget plus 1365 s for the preflight probes (275-510 s over nine worker runs,
    # D-070) and the toolchain setup, which is 11400 s -- exactly 190 minutes.
    # tests/factory/test_factory_ladder_budget.py fails if this number drops below the budget
    # the record derives, so an inner budget can no longer outgrow this one in silence. The
    # previous 150 was already below the 8460 s the mutation rung alone had been given (D-075).
    timeout-minutes: 190
    env:
      # Identical to dark-factory-worker.yml, and for the same reason: the Anthropic SDK inside
      # Claude Code appends `/v1/messages` to this value, so it must be the API root. The probes
      # below prove the route the worker uses, so they must be pointed at the same place (D-010).
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_factory_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_factory_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''

      - name: Setup uv 0.12.5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''

      - name: Cache the Bun package store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/frontend/bun.lock') }}

      - name: Install pinned worker and browser CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.245
          test "$(claude --version)" = "2.1.245 (Claude Code)"
          npm install -g agent-browser@0.35.0
          agent-browser install --with-deps
          agent-browser --help >/dev/null

      - name: Create disposable validation environment
        shell: bash
        run: |
          # Same values as dark-factory-worker.yml. The database URL is assembled at run time
          # from the service's throwaway user, password, host and database rather than written
          # as one literal: the security guard scans every added line for credential-bearing
          # URLs and refuses the literal in a new file, even for a loopback throwaway (D-017).
          database_url="$(python -c 'print("postgresql://" + ":".join(("postgres", "postgres")) + "@" + "127.0.0.1:5432/dark_factory_validation")')"
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          e2e_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$e2e_password"
          {
            echo "DATABASE_URL=$database_url"
            echo "JWT_SECRET=$jwt_secret"
            echo "DARK_FACTORY_E2E_EMAIL=dark-factory-e2e@example.com"
            echo "DARK_FACTORY_E2E_PASSWORD=$e2e_password"
            echo "DARK_FACTORY_E2E_BOOTSTRAP=1"
            echo "SEED_ENABLE=false"
          } >> "$GITHUB_ENV"
          # YOUTUBE_CHANNEL_ID is intentionally unnecessary here: the locked E2E
          # bootstraps one exact real video rather than synchronizing a channel.

      - name: Install locked dependencies
        run: |
          (cd app/backend && uv sync --frozen --all-extras)
          (cd app/frontend && bun install --frozen-lockfile)

      - name: Prove the worker's model route with the pinned CLI
        # The worker's probe, body for body (tests/factory/test_factory_workflow_hygiene.py
        # pins them equal), so one marker corpus spans both workflows. `continue-on-error`
        # because this job's verdict is the harness on main, never a probe (D-070).
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # The preflight must prove the request the worker actually makes, not a lookalike.
          # This runs the pinned CLI with the same flags factory_kernel/providers.py uses for a
          # tool-less worker, against each configured model, and refuses the run unless the CLI
          # itself reports a non-error result. A factory that cannot reason at all must stop
          # here rather than burn a validation ladder discovering it. Every request the kernel
          # makes names an effort level (`--effort`, D-055); the probe names a judge's.
          # The route probe is not on the worker's `run_answered_probes` switch: it runs on
          # every dispatch, because reachability is the one preflight question a new run can
          # answer differently from the last, and an unreachable slug must refuse before a
          # stage burns its budget (D-070).
          # Every distinct model a stage can run on: the worker model, the architecture
          # holdout's, and every per-role override in provider.model_overrides, listed by
          # scripts/factory_models.py from the same policy the kernel loads. A model the
          # list omits is a route no preflight proved; a list the script cannot produce
          # (a typo in the table) refuses the run here, before any stage (D-061).
          route_models="$(python3 scripts/factory_models.py --list)"
          test -n "$route_models" || { echo "FACTORY_PREFLIGHT_REFUSED scripts/factory_models.py listed no model"; exit 1; }
          for model in $route_models; do
            set +e
            timeout 180 claude --bare -p "Reply with exactly the word OK and nothing else." \
              --model "$model" --permission-mode dontAsk --tools "" \
              --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands \
              --output-format json --max-turns 2 --max-budget-usd 1 --effort high > /tmp/route-probe.json 2>/tmp/route-probe.err
            set -e
            # Reachability is the envelope's error state, never the text of `result`: a model
            # may answer a one-word prompt with an empty final message (DeepSeek does, spending
            # only thinking tokens) and still be perfectly routed. Stage workers write files;
            # no stage relies on a bare final message. Refuse only on is_error, a missing or
            # malformed envelope, an abnormal stop, or zero turns.
            verdict="$(python3 - <<'PY' 2>/dev/null || echo "false stop_reason=unreadable output_tokens=0"
          import json
          d = json.load(open("/tmp/route-probe.json"))
          stop = str(d.get("stop_reason") or "")
          turns = d.get("num_turns") or 0
          usage = d.get("usage") if isinstance(d.get("usage"), dict) else {}
          out = usage.get("output_tokens", 0)
          routed = (d.get("is_error") is False
                    and stop in {"end_turn", "stop_sequence", "max_tokens"}
                    and isinstance(turns, int) and turns >= 1
                    and (bool(d.get("modelUsage")) or bool(usage)))
          print(f"{'true' if routed else 'false'} stop_reason={stop or 'none'} output_tokens={out}")
          PY
          )"
            ok="${verdict%% *}"
            test "$ok" = "true" || {
              echo "FACTORY_PREFLIGHT_REFUSED worker CLI cannot reach model $model ($verdict)"
              head -c 600 /tmp/route-probe.json; echo; head -c 400 /tmp/route-probe.err; echo
              exit 1
            }
            echo "FACTORY_PREFLIGHT_MODEL_ROUTE_OK model=$model ${verdict#* }"
          done

      - name: Probe whether the route honours an effort level
        # The worker's probe, body for body (tests/factory/test_factory_workflow_hygiene.py
        # pins them equal), so one marker corpus spans both workflows. `continue-on-error`
        # because this job's verdict is the harness on main, never a probe (D-070).
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Whether the route honours the level is measured, not assumed: the worker model
          # twice on one fixed reasoning prompt, one turn each, at the lowest and the highest
          # level the policy uses (scripts/factory_effort_probe.py), counting the thinking each
          # stream showed. The line is data for tuning `worker_policy.ROLE_EFFORT`; a
          # `honoured=false` is printed, never a refusal (D-055).
          worker_model="$(python3 -c 'import json;print(json.load(open(".factory/kernel.json"))["provider"]["model"])')"
          timeout 400 python3 scripts/factory_effort_probe.py --model "$worker_model" \
            || echo "FACTORY_PREFLIGHT_EFFORT_PROBE model=$worker_model low_thinking=0 high_thinking=0 honoured=false error=probe-did-not-run"

      - name: Probe whether the route honours a thinking budget
        # The worker's probe, body for body (tests/factory/test_factory_workflow_hygiene.py
        # pins them equal), so one marker corpus spans both workflows. `continue-on-error`
        # because this job's verdict is the harness on main, never a probe (D-070).
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # `--effort` is not a bound on this route: the effort probe read honoured=false,
          # true, true, false across the last four builds of issue #103, and all six died or
          # overran in `test_author` (the sixth: 2025 s, 15 turns, 121,065 thinking tokens).
          # The CLI's thinking budget, `MAX_THINKING_TOKENS` in its environment, is the lever
          # not yet tried. The worker model three times on the effort probe's prompt, one
          # turn each: uncapped, at a 1024-token budget, and with thinking disabled (0),
          # counting the thinking each stream showed (scripts/factory_thinking_cap_probe.py).
          # The line is data for `worker_policy.ROLE_THINKING_CAP`, every row of which is
          # None until it says the budget is honoured; never a refusal (D-059).
          worker_model="$(python3 -c 'import json;print(json.load(open(".factory/kernel.json"))["provider"]["model"])')"
          timeout 600 python3 scripts/factory_thinking_cap_probe.py --model "$worker_model" \
            || echo "FACTORY_PREFLIGHT_THINKING_CAP_PROBE model=$worker_model uncapped=0 cap1024=0 cap0=0 honoured=false error=probe-did-not-run"

      - name: Prove the worker's read scope with the pinned CLI
        # The worker's probe, body for body (tests/factory/test_factory_workflow_hygiene.py
        # pins them equal), so one marker corpus spans both workflows. `continue-on-error`
        # because this job's verdict is the harness on main, never a probe (D-070).
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Every tool-bearing worker runs inside a file boundary the kernel renders as CLI
          # permission rules (worker_policy.ROLE_PATH_SCOPE: the product tree and the run's
          # artifacts; the trust root denied). Whether the pinned CLI enforces those rules on
          # this runner is proved here, on a throwaway tree, with the exact argv the kernel
          # renders for a test_author (scripts/factory_read_scope_probe.py). The line is data;
          # a read the rules should have denied that returned the file is a refusal, because a
          # worker that can read its judge is the defect the scope removes (D-057). The same
          # process also greps the tree and globs for the probe files, and reports what the
          # CLI registered (`tools=`, `tools_missing=`): the test_author of run 34033360798
          # was granted Glob and Grep and had neither, because --bare put the CLI in simple
          # mode (D-065). A leak through Grep is the same refusal as one through Read.
          worker_model="$(python3 -c 'import json;print(json.load(open(".factory/kernel.json"))["provider"]["model"])')"
          set +e
          timeout 400 python3 scripts/factory_read_scope_probe.py --model "$worker_model"
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "FACTORY_PREFLIGHT_REFUSED the pinned CLI let a scoped worker read outside its read scope"
            exit 1
          fi
          test "$rc" = "0" || echo "FACTORY_PREFLIGHT_READ_SCOPE_PROBE model=$worker_model denied_outside_scope=false attempted_outside_scope=false read_inside_scope=false read_artifacts=false grep_denied_outside_scope=false glob_outside_scope=false tools=none tools_missing=none events=0 error=probe-did-not-run"

      - name: Full canonical harness on main
        id: gate
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          FACTORY_WORKDIR: ${{ runner.temp }}/dark-factory
          # The browser journey writes its failure dump (snapshot, page, console, network,
          # scrubbed cookies, screenshot) under $ARTIFACTS_DIR/e2e-evidence; the step below
          # uploads it. Without this the dump lands in /tmp and dies with the runner (D-049).
          ARTIFACTS_DIR: ${{ runner.temp }}/dark-factory/main-regression/artifacts
        run: |
          set +e
          python harness/ci.py 2>&1 | tee /tmp/main-regression.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "0" ] && grep -q '^GATE_OK mode=full' /tmp/main-regression.log; then
            echo "MAIN_REGRESSION_OK head=$(git rev-parse HEAD)"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "MAIN_REGRESSION_FAILED head=$(git rev-parse HEAD) rc=$rc"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload harness log and browser evidence (observability)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-factory-main-regression-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            /tmp/main-regression.log
            ${{ runner.temp }}/dark-factory/main-regression/artifacts/e2e-evidence/**

      - name: File or update the regression issue
        if: steps.gate.outputs.failed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head="$(git rev-parse HEAD)"
          today="$(date -u +%Y-%m-%d)"
          title_prefix="regression: main failed the full harness"
          # The failing marker lines are the evidence; the whole log stays in the run.
          markers="$(grep -E '^[A-Z_]+_(FAILED|REFUSED|ABSENT)|^E2E_|^HOLDOUT_|^MUTATIONS_|^UNIT_|^STATIC_|^GATE_' /tmp/main-regression.log | tail -40)"
          body_file=/tmp/regression-body.md
          {
            echo "The daily full-harness regression on \`main\` failed."
            echo
            echo "- Head: \`$head\`"
            echo "- Run: $RUN_URL"
            echo
            echo "Marker lines:"
            echo
            echo '```'
            echo "$markers"
            echo '```'
            echo
            echo "<!-- dark-factory-main-regression -->"
          } > "$body_file"
          existing="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title_prefix\" in:title" --json number,comments --jq '.[0]')"
          if [ -z "$existing" ] || [ "$existing" = "null" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" \
              --title "$title_prefix on $today" \
              --label "priority:high" --label "type:bug" \
              --body-file "$body_file"
            echo "MAIN_REGRESSION_ISSUE_FILED"
          else
            number="$(jq -r '.number' <<<"$existing")"
            prior="$(gh issue view "$number" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(contains("dark-factory-main-regression"))] | length')"
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file "$body_file"
            echo "MAIN_REGRESSION_ISSUE_UPDATED number=$number prior_reports=$prior"
            # Two consecutive failures in the same area: the factory cannot self-correct this;
            # escalate to a human per FACTORY_RULES section 7.
            if [ "$prior" -ge 1 ]; then
              gh issue edit "$number" -R "$GITHUB_REPOSITORY" --add-label "factory:needs-human"
              echo "MAIN_REGRESSION_ESCALATED number=$number"
            fi
          fi
          exit 1
