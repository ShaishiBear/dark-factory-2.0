name: credential-scope-maintenance

on:
  push:
    branches: [validation/df2-credential-scope-patch-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rewrite/df2-repo-owned-factory
          fetch-depth: 0
      - name: Assert exact rewrite head
        run: test "$(git rev-parse HEAD)" = "b111921cc989e1aea31b7332910cd3b38fb28f9c"
      - name: Apply exact credential-scope changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PATCH_REFUSED {path}: expected one anchor, saw {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Kernel subprocesses are credential-free unless a trusted caller asks for a scope.
          replace(
              "factory_kernel/runtime.py",
              "from .config import KernelConfig\nfrom .github_cli import GitHubClient\n",
              "from .config import KernelConfig\nfrom .credential_env import scoped_environment\nfrom .github_cli import GitHubClient\n",
          )
          replace(
              "factory_kernel/runtime.py",
              '''    def check_stop(self) -> None:\n        env = dict(os.environ)\n        env["FACTORY_REPO"] = self.config.repository\n        env.setdefault("FACTORY_WORKDIR", str(self.config.runtime.work_root))\n''',
              '''    def check_stop(self) -> None:\n        env = scoped_environment(\n            {\n                "FACTORY_REPO": self.config.repository,\n                "FACTORY_WORKDIR": str(self.config.runtime.work_root),\n            },\n            scope="github",\n        )\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''    def reap_stale_claims(self) -> None:\n        self._exec(\n            [\n                "python", "scripts/factory_lease.py", "reap",\n                "--active-ttl", str(self.config.runtime.active_lease_ttl_seconds),\n                "--legacy-ttl", str(self.config.runtime.legacy_lease_ttl_seconds),\n            ],\n            cwd=self.repo_root,\n            timeout=180,\n        )\n''',
              '''    def reap_stale_claims(self) -> None:\n        self._exec(\n            [\n                "python", "scripts/factory_lease.py", "reap",\n                "--active-ttl", str(self.config.runtime.active_lease_ttl_seconds),\n                "--legacy-ttl", str(self.config.runtime.legacy_lease_ttl_seconds),\n            ],\n            cwd=self.repo_root,\n            credential_scope="github",\n            timeout=180,\n        )\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                cwd=worktree.path,\n                env=env,\n                timeout=120,\n            )\n            self._exec(\n                [\n                    "python", "scripts/factory_proof.py", "attach",\n''',
              '''                cwd=worktree.path,\n                env=env,\n                credential_scope="github",\n                timeout=120,\n            )\n            self._exec(\n                [\n                    "python", "scripts/factory_proof.py", "attach",\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                cwd=worktree.path,\n                env=env,\n                timeout=180,\n            )\n            self.github.add_pr_label(pr_number, self.config.labels["needs_review"])\n''',
              '''                cwd=worktree.path,\n                env=env,\n                credential_scope="github",\n                timeout=180,\n            )\n            self.github.add_pr_label(pr_number, self.config.labels["needs_review"])\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                    "--output", str(paths.artifacts / "security.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                timeout=180,\n''',
              '''                    "--output", str(paths.artifacts / "security.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                credential_scope="github",\n                timeout=180,\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                cwd=worktree.path,\n                env=env,\n                timeout=2400,\n                transcript=paths.transcripts / "evidence.log",\n''',
              '''                cwd=worktree.path,\n                env=env,\n                credential_scope="github+validation",\n                timeout=2400,\n                transcript=paths.transcripts / "evidence.log",\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                    "--output", str(paths.artifacts / "merge-authorization.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                timeout=180,\n''',
              '''                    "--output", str(paths.artifacts / "merge-authorization.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                credential_scope="github",\n                timeout=180,\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''                    "--output", str(paths.artifacts / "merge-verification.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                timeout=240,\n''',
              '''                    "--output", str(paths.artifacts / "merge-verification.json"),\n                ],\n                cwd=worktree.path,\n                env=env,\n                credential_scope="github",\n                timeout=240,\n''',
          )
          replace(
              "factory_kernel/runtime.py",
              '''        env: Mapping[str, str] | None = None,\n        timeout: int = 300,\n        transcript: Path | None = None,\n    ) -> str:\n        merged = dict(os.environ)\n        if env:\n            merged.update(env)\n''',
              '''        env: Mapping[str, str] | None = None,\n        credential_scope: str = "none",\n        timeout: int = 300,\n        transcript: Path | None = None,\n    ) -> str:\n        merged = scoped_environment(env, scope=credential_scope)\n''',
          )

          # GitHub CLI receives GitHub authority only; git push gets a one-operation askpass token.
          replace(
              "factory_kernel/github_cli.py",
              "import json\nimport re\nimport subprocess\nfrom pathlib import Path\nfrom typing import Any, Mapping\n",
              "import json\nimport os\nimport re\nimport subprocess\nimport tempfile\nfrom pathlib import Path\nfrom typing import Any, Mapping\n\nfrom .credential_env import scoped_environment\n",
          )
          replace(
              "factory_kernel/github_cli.py",
              '''            ["gh", *args],\n            cwd=self.cwd,\n            capture_output=True,\n''',
              '''            ["gh", *args],\n            cwd=self.cwd,\n            env=scoped_environment(scope="github"),\n            capture_output=True,\n''',
          )
          old_push = '''    def push_branch(self, branch: str) -> None:\n        if not branch.strip() or branch.startswith("-"):\n            raise ValueError("unsafe branch name")\n        proc = subprocess.run(\n            ["git", "push", "-u", "origin", branch],\n            cwd=self.cwd,\n            capture_output=True,\n            text=True,\n            encoding="utf-8",\n            errors="replace",\n            timeout=180,\n        )\n        if proc.returncode:\n            raise RuntimeError(f"git push failed: {((proc.stdout or '') + (proc.stderr or ''))[-3000:]}")\n'''
          new_push = '''    def push_branch(self, branch: str) -> None:\n        if not branch.strip() or branch.startswith("-"):\n            raise ValueError("unsafe branch name")\n        github_env = scoped_environment(scope="github")\n        token = github_env.get("GH_TOKEN") or github_env.get("GITHUB_TOKEN")\n        if not token:\n            raise RuntimeError("git push requires GH_TOKEN or GITHUB_TOKEN")\n        with tempfile.TemporaryDirectory(prefix="dark-factory-git-auth-") as tmp:\n            askpass = Path(tmp) / "askpass.sh"\n            askpass.write_text(\n                "#!/bin/sh\\n"\n                "case \\\"$1\\\" in\\n"\n                "  *Username*) printf '%s\\\\n' 'x-access-token' ;;\\n"\n                "  *Password*) printf '%s\\\\n' \\\"$FACTORY_GIT_TOKEN\\\" ;;\\n"\n                "  *) exit 1 ;;\\n"\n                "esac\\n",\n                encoding="utf-8",\n            )\n            askpass.chmod(0o700)\n            env = scoped_environment(scope="none")\n            env.update(\n                {\n                    "GIT_ASKPASS": str(askpass),\n                    "GIT_TERMINAL_PROMPT": "0",\n                    "FACTORY_GIT_TOKEN": token,\n                }\n            )\n            proc = subprocess.run(\n                [\n                    "git", "push",\n                    f"https://github.com/{self.repository}.git",\n                    f"HEAD:refs/heads/{branch}",\n                ],\n                cwd=self.cwd,\n                env=env,\n                capture_output=True,\n                text=True,\n                encoding="utf-8",\n                errors="replace",\n                timeout=180,\n            )\n        if proc.returncode:\n            raise RuntimeError(f"git push failed: {((proc.stdout or '') + (proc.stderr or ''))[-3000:]}")\n'''
          replace("factory_kernel/github_cli.py", old_push, new_push)

          # Evidence subprocesses independently prevent GitHub/validation credentials crossing into RED/GREEN.
          replace(
              "scripts/factory_evidence.py",
              '''HEX64 = re.compile(r"^[0-9a-f]{64}$")\n\n\ndef die(msg: str) -> None:\n''',
              '''HEX64 = re.compile(r"^[0-9a-f]{64}$")\nGITHUB_CREDENTIALS = ("GH_TOKEN", "GITHUB_TOKEN")\nVALIDATION_CREDENTIALS = (\n    "DATABASE_URL", "OPENROUTER_API_KEY", "JWT_SECRET", "SUPADATA_API_KEY",\n    "YOUTUBE_CHANNEL_ID", "DARK_FACTORY_E2E_EMAIL", "DARK_FACTORY_E2E_PASSWORD",\n)\nPROVIDER_CREDENTIAL_PREFIXES = ("ANTHROPIC_", "CLAUDE_", "AWS_", "GOOGLE_", "AZURE_")\n\n\ndef _child_env(scope: str = "none") -> dict[str, str]:\n    if scope not in {"none", "github", "validation"}:\n        raise ValueError(f"invalid evidence credential scope: {scope}")\n    original = dict(os.environ)\n\n    def sensitive(name: str) -> bool:\n        return (\n            name in GITHUB_CREDENTIALS\n            or name in VALIDATION_CREDENTIALS\n            or name.startswith(PROVIDER_CREDENTIAL_PREFIXES)\n        )\n\n    child = {key: value for key, value in original.items() if not sensitive(key)}\n    allowed = GITHUB_CREDENTIALS if scope == "github" else VALIDATION_CREDENTIALS if scope == "validation" else ()\n    for key in allowed:\n        if original.get(key):\n            child[key] = original[key]\n    return child\n\n\ndef die(msg: str) -> None:\n''',
          )
          replace(
              "scripts/factory_evidence.py",
              '''def run(argv: list[str], cwd: Path = ROOT, timeout: int = 300,\n        check: bool = True) -> subprocess.CompletedProcess[str]:\n    p = subprocess.run(argv, cwd=cwd, capture_output=True, text=True, encoding="utf-8",\n                       errors="replace", timeout=timeout)\n''',
              '''def run(argv: list[str], cwd: Path = ROOT, timeout: int = 300,\n        check: bool = True, credential_scope: str = "none") -> subprocess.CompletedProcess[str]:\n    p = subprocess.run(\n        argv, cwd=cwd, env=_child_env(credential_scope), capture_output=True, text=True,\n        encoding="utf-8", errors="replace", timeout=timeout,\n    )\n''',
          )
          replace(
              "scripts/factory_evidence.py",
              '''                           "body,headRefOid,baseRefOid"], timeout=30).stdout)\n''',
              '''                           "body,headRefOid,baseRefOid"], timeout=30, credential_scope="github").stdout)\n''',
          )
          replace(
              "scripts/factory_evidence.py",
              '''    harness = run([sys.executable, "harness/ci.py"], timeout=1800, check=False)\n''',
              '''    harness = run(\n        [sys.executable, "harness/ci.py"], timeout=1800, check=False,\n        credential_scope="validation",\n    )\n''',
          )

          # Tests: prove capability scoping, one-operation push auth, scheduler invariants.
          replace(
              "tests/factory/test_factory_worker_authority.py",
              '''from factory_kernel.config import ProviderConfig\nfrom factory_kernel.git_authority import (\n''',
              '''from factory_kernel.config import ProviderConfig\nfrom factory_kernel.credential_env import scoped_environment\nfrom factory_kernel.github_cli import GitHubClient\nfrom factory_kernel.runtime import KernelRuntime\nfrom factory_kernel.git_authority import (\n''',
          )
          marker = '''\n\nclass GitAuthorityTests(unittest.TestCase):\n'''
          inserted = '''\n\nclass CredentialScopeTests(unittest.TestCase):\n    def source(self):\n        return {\n            "PATH": "/usr/bin",\n            "NORMAL": "safe",\n            "GH_TOKEN": "github-write",\n            "DATABASE_URL": "validation-db",\n            "OPENROUTER_API_KEY": "validation-llm",\n            "ANTHROPIC_API_KEY": "model-auth",\n        }\n\n    def test_scoped_environment_requires_explicit_capability(self):\n        none = scoped_environment(source=self.source())\n        self.assertEqual(none["NORMAL"], "safe")\n        self.assertNotIn("GH_TOKEN", none)\n        self.assertNotIn("DATABASE_URL", none)\n        self.assertNotIn("OPENROUTER_API_KEY", none)\n        self.assertNotIn("ANTHROPIC_API_KEY", none)\n\n        github = scoped_environment(scope="github", source=self.source())\n        self.assertEqual(github["GH_TOKEN"], "github-write")\n        self.assertNotIn("DATABASE_URL", github)\n        self.assertNotIn("ANTHROPIC_API_KEY", github)\n\n        validation = scoped_environment(scope="validation", source=self.source())\n        self.assertEqual(validation["DATABASE_URL"], "validation-db")\n        self.assertEqual(validation["OPENROUTER_API_KEY"], "validation-llm")\n        self.assertNotIn("GH_TOKEN", validation)\n        self.assertNotIn("ANTHROPIC_API_KEY", validation)\n\n        both = scoped_environment(scope="github+validation", source=self.source())\n        self.assertEqual(both["GH_TOKEN"], "github-write")\n        self.assertEqual(both["DATABASE_URL"], "validation-db")\n        self.assertNotIn("ANTHROPIC_API_KEY", both)\n\n        with self.assertRaises(ValueError):\n            scoped_environment({"GH_TOKEN": "smuggled"}, source=self.source())\n\n    @patch("factory_kernel.runtime.subprocess.run")\n    def test_kernel_exec_defaults_to_zero_credentials(self, run):\n        run.return_value = Mock(returncode=0, stdout="ok", stderr="")\n        runtime = object.__new__(KernelRuntime)\n        with patch.dict(os.environ, self.source(), clear=True):\n            runtime._exec(["true"], cwd=Path("/tmp"))\n        env = run.call_args.kwargs["env"]\n        self.assertNotIn("GH_TOKEN", env)\n        self.assertNotIn("DATABASE_URL", env)\n        self.assertNotIn("OPENROUTER_API_KEY", env)\n        self.assertNotIn("ANTHROPIC_API_KEY", env)\n\n    @patch("factory_kernel.github_cli.subprocess.run")\n    def test_git_push_token_is_ephemeral_child_capability(self, run):\n        run.return_value = Mock(returncode=0, stdout="", stderr="")\n        with tempfile.TemporaryDirectory() as tmp:\n            client = GitHubClient("owner/repo", cwd=tmp)\n            with patch.dict(os.environ, self.source(), clear=True):\n                client.push_branch("factory/issue-7")\n        argv = run.call_args.args[0]\n        env = run.call_args.kwargs["env"]\n        self.assertNotIn("github-write", " ".join(argv))\n        self.assertNotIn("GH_TOKEN", env)\n        self.assertNotIn("DATABASE_URL", env)\n        self.assertNotIn("OPENROUTER_API_KEY", env)\n        self.assertNotIn("ANTHROPIC_API_KEY", env)\n        self.assertEqual(env["FACTORY_GIT_TOKEN"], "github-write")\n        self.assertEqual(env["GIT_TERMINAL_PROMPT"], "0")\n        self.assertIn("GIT_ASKPASS", env)\n\n\nclass GitHubWorkerWorkflowTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.workflow = (ROOT / ".github/workflows/dark-factory-worker.yml").read_text(encoding="utf-8")\n\n    def test_scheduler_is_only_schedule_or_manual_and_never_cancels_active_authority(self):\n        self.assertIn("  schedule:\\n", self.workflow)\n        self.assertIn("  workflow_dispatch:\\n", self.workflow)\n        self.assertNotIn("pull_request_target:", self.workflow)\n        self.assertNotIn("\\n  pull_request:\\n", self.workflow)\n        self.assertIn("cancel-in-progress: false", self.workflow)\n        self.assertIn("timeout-minutes: 300", self.workflow)\n\n    def test_scheduler_does_not_persist_write_token_into_checkout(self):\n        self.assertIn("persist-credentials: false", self.workflow)\n        self.assertNotIn("persist-credentials: true", self.workflow)\n\n    def test_scheduler_permissions_are_explicit_and_worker_tools_are_pinned(self):\n        for permission in ("contents: write", "issues: write", "pull-requests: write"):\n            self.assertIn(permission, self.workflow)\n        for ref in (\n            "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",\n            "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",\n            "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",\n            "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",\n            "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6",\n            "@anthropic-ai/claude-code@2.1.245",\n            "agent-browser@0.35.0",\n        ):\n            self.assertIn(ref, self.workflow)\n        self.assertGreaterEqual(self.workflow.count("token: ''"), 3)\n        self.assertIn("github-token: ''", self.workflow)\n\n    def test_scheduler_fails_closed_before_exact_one_shot_dispatch(self):\n        self.assertIn("FACTORY_PREFLIGHT_REFUSED GitHub Issues are disabled", self.workflow)\n        for name in (\n            "ANTHROPIC_API_KEY", "DATABASE_URL", "OPENROUTER_API_KEY", "JWT_SECRET",\n            "SUPADATA_API_KEY", "YOUTUBE_CHANNEL_ID", "DARK_FACTORY_E2E_EMAIL",\n            "DARK_FACTORY_E2E_PASSWORD",\n        ):\n            self.assertIn(name, self.workflow)\n        self.assertIn("run: python -m factory_kernel dispatch --once", self.workflow)\n        self.assertNotIn("dispatch --once --no-merge", self.workflow)\n\n''' + marker
          replace("tests/factory/test_factory_worker_authority.py", marker, inserted)

          replace(
              "tests/factory/test_factory_evidence.py",
              '''class EvidenceTests(unittest.TestCase):\n    def floors(self):\n''',
              '''class EvidenceTests(unittest.TestCase):\n    def test_child_env_separates_github_from_validation_credentials(self):\n        source = {\n            "PATH": "/usr/bin", "GH_TOKEN": "github-write",\n            "DATABASE_URL": "validation-db", "OPENROUTER_API_KEY": "validation-llm",\n            "ANTHROPIC_API_KEY": "model-auth",\n        }\n        with mock.patch.dict(m.os.environ, source, clear=True):\n            none = m._child_env()\n            github = m._child_env("github")\n            validation = m._child_env("validation")\n        self.assertNotIn("GH_TOKEN", none)\n        self.assertNotIn("DATABASE_URL", none)\n        self.assertNotIn("ANTHROPIC_API_KEY", none)\n        self.assertEqual(github["GH_TOKEN"], "github-write")\n        self.assertNotIn("DATABASE_URL", github)\n        self.assertNotIn("ANTHROPIC_API_KEY", github)\n        self.assertEqual(validation["DATABASE_URL"], "validation-db")\n        self.assertEqual(validation["OPENROUTER_API_KEY"], "validation-llm")\n        self.assertNotIn("GH_TOKEN", validation)\n        self.assertNotIn("ANTHROPIC_API_KEY", validation)\n\n    def floors(self):\n''',
          )

          # Mutation copies include the scheduler, then attack all newly added boundaries.
          replace(
              "harness/factory_mutations/run.py",
              '''COPY_FILES = (\n    ".factory/architecture.json",\n''',
              '''COPY_FILES = (\n    ".github/workflows/dark-factory-worker.yml",\n    ".factory/architecture.json",\n''',
          )

          defects_path = Path("harness/factory_mutations/defects.json")
          defects_doc = json.loads(defects_path.read_text(encoding="utf-8"))
          additions = [
              {
                  "id": "worker-kernel-subprocess-secret-scrub-disabled",
                  "file": "factory_kernel/runtime.py",
                  "find": "        merged = scoped_environment(env, scope=credential_scope)",
                  "replace": "        merged = dict(os.environ)\n        if env:\n            merged.update(env)",
                  "why": "PR-controlled dependency and test subprocesses could inherit GitHub, model and validation credentials.",
              },
              {
                  "id": "worker-evidence-child-secret-scrub-disabled",
                  "file": "scripts/factory_evidence.py",
                  "find": "    child = {key: value for key, value in original.items() if not sensitive(key)}",
                  "replace": "    child = dict(original)",
                  "why": "Independent RED/GREEN replay could inherit the repository write token or validation credentials.",
              },
              {
                  "id": "worker-git-push-ambient-secret-env-restored",
                  "file": "factory_kernel/github_cli.py",
                  "find": "            env = scoped_environment(scope=\"none\")",
                  "replace": "            env = dict(os.environ)",
                  "why": "The trusted git push child could unnecessarily inherit application and model credentials.",
              },
              {
                  "id": "worker-scheduler-persists-checkout-token",
                  "file": ".github/workflows/dark-factory-worker.yml",
                  "find": "          persist-credentials: false",
                  "replace": "          persist-credentials: true",
                  "why": "A write-capable GitHub token could be stored in Git config where PR-controlled subprocesses can read it.",
              },
              {
                  "id": "worker-scheduler-disables-merge-authority",
                  "file": ".github/workflows/dark-factory-worker.yml",
                  "find": "        run: python -m factory_kernel dispatch --once",
                  "replace": "        run: python -m factory_kernel dispatch --once --no-merge",
                  "why": "The production scheduler could silently stop exercising the intended exact-head merge authority path.",
              },
              {
                  "id": "worker-scheduler-claude-version-floats",
                  "file": ".github/workflows/dark-factory-worker.yml",
                  "find": "          npm install -g @anthropic-ai/claude-code@2.1.245",
                  "replace": "          npm install -g @anthropic-ai/claude-code",
                  "why": "The reasoning-worker executable could drift between unattended runs without review or revalidation.",
              },
          ]
          existing = {d.get("id") for d in defects_doc.get("defects", [])}
          if any(d["id"] in existing for d in additions):
              raise SystemExit("PATCH_REFUSED mutation id already exists")
          defects_doc["defects"].extend(additions)
          defects_path.write_text(json.dumps(defects_doc, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit and push exact patch
        run: |
          git diff --check
          git status --short
          git add factory_kernel/runtime.py factory_kernel/github_cli.py scripts/factory_evidence.py \
            tests/factory/test_factory_worker_authority.py tests/factory/test_factory_evidence.py \
            harness/factory_mutations/run.py harness/factory_mutations/defects.json
          git -c user.name='Dark Factory Maintainer' -c user.email='dark-factory@users.noreply.github.com' \
            commit -m 'security(factory): isolate GitHub and validation credentials'
          git push origin HEAD:rewrite/df2-repo-owned-factory
