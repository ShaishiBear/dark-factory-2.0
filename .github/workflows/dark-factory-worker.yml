name: dark-factory-worker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      # Operator recovery (D-034): finish a build that pushed its branch and opened its PR but
      # died before publish/handoff, from the artifacts that run uploaded. Both or neither.
      resume_pr:
        description: PR number to resume (requires resume_run_id)
        required: false
        default: ''
      resume_run_id:
        description: Worker run id whose uploaded artifacts hold the build (requires resume_pr)
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Only for `gh run download` of a previous run's artifacts on a resume.
  actions: read

concurrency:
  group: dark-factory-worker
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'ShaishiBear/dark-factory-2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Model calls are routed to OpenRouter's Anthropic-compatible Messages endpoint rather than
      # Anthropic's first-party API. The Anthropic SDK inside Claude Code appends `/v1/messages`
      # to this value, so it must be the API root, not the versioned path: with `/api/v1` here
      # the CLI requested `/api/v1/v1/messages`, received OpenRouter's HTML 404 page, and reported
      # "there's an issue with the selected model" for every model (run 33876017910, D-010).
      # Defined once at job level so the preflight probes and the dispatch cannot diverge.
      ANTHROPIC_BASE_URL: https://openrouter.ai/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dark_factory_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dark_factory_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check operational prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          RESUME_PR: ${{ inputs.resume_pr }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          # A resume needs the PR and the run whose artifacts hold its build; one without the
          # other is a typo, not a request, and must not fall through to an ordinary dispatch.
          if { [ -n "${RESUME_PR}" ] && [ -z "${RESUME_RUN_ID}" ]; } || { [ -z "${RESUME_PR}" ] && [ -n "${RESUME_RUN_ID}" ]; }; then
            echo "FACTORY_PREFLIGHT_REFUSED resume needs both resume_pr and resume_run_id"
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')" = "true" || {
            echo "FACTORY_PREFLIGHT_REFUSED GitHub Issues are disabled"
            exit 1
          }

          # The in-repo exact-head/evidence verifier cannot stop someone bypassing it
          # with a direct push to an unprotected default branch. Refuse autonomous
          # operation unless GitHub itself reports main as protected.
          main_protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected')"
          test "$main_protected" = "true" || {
            echo "FACTORY_PREFLIGHT_REFUSED main branch is not protected"
            exit 1
          }

          # Every label the kernel can apply must exist: the factory:* controls from kernel.json
          # plus the priority:* and type:* labels triage attaches on accept. The list comes from
          # the kernel itself so a new label in the code cannot outrun this check (D-011).
          labels="$(gh label list -R "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name')"
          required_labels="$(python3 -c 'import json; from factory_kernel.triage import label_vocabulary; print("\n".join(label_vocabulary(json.load(open(".factory/kernel.json"))["labels"])))')"
          test -n "$required_labels" || { echo "FACTORY_PREFLIGHT_REFUSED kernel label vocabulary is empty"; exit 1; }
          for label in $required_labels
          do
            grep -Fx -- "$label" <<<"$labels" >/dev/null || {
              echo "FACTORY_PREFLIGHT_REFUSED missing label $label"
              exit 1
            }
          done

          for name in OPENROUTER_API_KEY SUPADATA_API_KEY
          do
            test -n "${!name:-}" || {
              echo "FACTORY_PREFLIGHT_REFUSED missing secret $name"
              exit 1
            }
          done

          # The kernel opens the product PR with this same Actions token. Whether Actions may
          # create pull requests is a repository setting (Settings > Actions > General >
          # Workflow permissions > "Allow GitHub Actions to create and approve pull requests").
          # The first complete canary build (D-022) discovered it was off only after a
          # two-hour build, at `gh pr create`. Reading the setting needs administration:read,
          # which GITHUB_TOKEN does not hold, so this check is honest about its reach: an
          # explicit false refuses the run; a readable true passes; a 403 or other read failure
          # is reported as unverified and the run continues, failing loudly at PR creation.
          pr_permission="$(gh api "repos/$GITHUB_REPOSITORY/actions/permissions/workflow" \
            --jq '.can_approve_pull_request_reviews' 2>/dev/null || echo "unreadable")"
          case "$pr_permission" in
            true)
              echo "FACTORY_PREFLIGHT_PR_PERMISSION_OK"
              ;;
            false)
              echo "FACTORY_PREFLIGHT_REFUSED GitHub Actions may not create pull requests (Settings > Actions > General > Workflow permissions)"
              exit 1
              ;;
            *)
              echo "FACTORY_PREFLIGHT_PR_PERMISSION_UNVERIFIED token cannot read actions/permissions/workflow; a run will fail at gh pr create if the setting is off"
              ;;
          esac
          # Cheap early signal only: a raw request built the way the SDK builds it
          # (base URL + /v1/messages). The authority for the route is the CLI probe below,
          # which runs the pinned worker binary exactly as the kernel launches it.
          routing_model="$(python3 -c 'import json;print(json.load(open(".factory/kernel.json"))["provider"]["model"])')"
          routing_code="$(curl -sS -o /tmp/routing-preflight.json -w '%{http_code}' \
            -X POST "${ANTHROPIC_BASE_URL}/v1/messages" \
            -H "x-api-key: $OPENROUTER_API_KEY" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' \
            -d "{\"model\":\"$routing_model\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}")"
          test "$routing_code" = "200" || {
            echo "FACTORY_PREFLIGHT_REFUSED OpenRouter messages endpoint returned $routing_code for $routing_model"
            exit 1
          }

          echo "FACTORY_PREFLIGHT_OK"

      - name: Setup Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          token: ''

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          token: ''

      - name: Setup uv 0.12.5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.5'
          github-token: ''
          # The wheel cache only avoids re-downloading hash-verified artifacts; every install
          # still runs `uv sync --frozen`, so the lockfile stays the sole resolution (D-020).
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.0'
          token: ''

      - name: Cache the Bun package store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/frontend/bun.lock') }}

      - name: Install pinned worker and browser CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.245
          test "$(claude --version)" = "2.1.245 (Claude Code)"
          npm install -g agent-browser@0.35.0
          agent-browser install --with-deps
          agent-browser --help >/dev/null

      - name: Prove the worker's model route with the pinned CLI
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # The preflight must prove the request the worker actually makes, not a lookalike.
          # This runs the pinned CLI with the same flags factory_kernel/providers.py uses for a
          # tool-less worker, against each configured model, and refuses the run unless the CLI
          # itself reports a non-error result. A factory that cannot reason at all must stop
          # here rather than burn a validation ladder discovering it.
          for model in $(python3 -c 'import json;p=json.load(open(".factory/kernel.json"))["provider"];print(p["model"]);print(p.get("architecture_model") or "")'); do
            set +e
            timeout 180 claude --bare -p "Reply with exactly the word OK and nothing else." \
              --model "$model" --permission-mode dontAsk --tools "" \
              --strict-mcp-config --mcp-config '{"mcpServers":{}}' --disable-slash-commands \
              --output-format json --max-turns 2 --max-budget-usd 1 > /tmp/route-probe.json 2>/tmp/route-probe.err
            set -e
            ok="$(python3 -c 'import json;d=json.load(open("/tmp/route-probe.json"));print("true" if d.get("is_error") is False and d.get("result") else "false")' 2>/dev/null || echo false)"
            test "$ok" = "true" || {
              echo "FACTORY_PREFLIGHT_REFUSED worker CLI cannot reach model $model"
              head -c 600 /tmp/route-probe.json; echo; head -c 400 /tmp/route-probe.err; echo
              exit 1
            }
            echo "FACTORY_PREFLIGHT_MODEL_ROUTE_OK model=$model"
          done

      - name: Create disposable validation environment
        shell: bash
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          e2e_password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$e2e_password"
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/dark_factory_validation"
            echo "JWT_SECRET=$jwt_secret"
            echo "DARK_FACTORY_E2E_EMAIL=dark-factory-e2e@localhost.invalid"
            echo "DARK_FACTORY_E2E_PASSWORD=$e2e_password"
            echo "DARK_FACTORY_E2E_BOOTSTRAP=1"
            echo "SEED_ENABLE=false"
          } >> "$GITHUB_ENV"
          # YOUTUBE_CHANNEL_ID is intentionally unnecessary here: the locked E2E
          # bootstraps one exact real video rather than synchronizing a channel.

      - name: Validate kernel configuration
        run: python -m factory_kernel config-check

      - name: Fail closed on emergency stop before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m factory_kernel stop-check

      - name: Download the build's artifacts
        if: inputs.resume_pr != '' && inputs.resume_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          # The uploaded artifact of the run that built the PR is the only honest input to a
          # resume; the runner that produced it is gone. Exactly one build must be inside it.
          gh run download "$RESUME_RUN_ID" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/resume-build"
          proofs="$(find "$RUNNER_TEMP/resume-build" -name final-green-proof.json)"
          count="$(printf '%s\n' "$proofs" | grep -c . || true)"
          test "$count" = "1" || {
            echo "FACTORY_PREFLIGHT_REFUSED run $RESUME_RUN_ID artifacts hold $count builds (need exactly one final-green-proof.json)"
            exit 1
          }
          echo "RESUME_ARTIFACTS=$(dirname "$proofs")" >> "$GITHUB_ENV"
          echo "FACTORY_RESUME_ARTIFACTS_OK run=$RESUME_RUN_ID"

      - name: Dispatch exactly one factory action
        env:
          GH_TOKEN: ${{ github.token }}
          # ClaudeCliProvider._worker_env forwards ANTHROPIC_* to the model subprocess, so the
          # CLI picks up the job-level ANTHROPIC_BASE_URL and this token without any provider-code
          # change. OPENROUTER_API_KEY is kept separately because application validation uses it
          # directly for embeddings/inference.
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          FACTORY_WORKDIR: ${{ runner.temp }}/dark-factory
          RESUME_PR: ${{ inputs.resume_pr }}
        shell: bash
        run: |
          # Exactly one action per run: a resume is the action, and `dispatch --once` does not
          # also run, or the same run could both finish one PR and start another build.
          if [ -n "${RESUME_PR}" ]; then
            python -m factory_kernel resume --pr "$RESUME_PR" --artifacts "$RESUME_ARTIFACTS"
          else
            python -m factory_kernel dispatch --once
          fi

      # Observability only: nothing reads these to decide anything. Model transcripts, the
      # per-stage telemetry and timings, the deterministic gates' logs and the run's JSON
      # artifacts are kept for a week so a slow or failed stage can be read after the runner is
      # gone. Logs of programs that hold credentials (evidence, merge, post-merge, security) and
      # the dependency installs are excluded; the kernel never writes a secret into artifacts.
      - name: Upload run transcripts and artifacts (observability)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dark-factory-run-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dark-factory/runs/*/transcripts/agent-*.log
            ${{ runner.temp }}/dark-factory/runs/*/transcripts/agent-*.json
            ${{ runner.temp }}/dark-factory/runs/*/transcripts/stage-timings.jsonl
            ${{ runner.temp }}/dark-factory/runs/*/transcripts/*-gate.log
            ${{ runner.temp }}/dark-factory/runs/*/artifacts/*.json
            !${{ runner.temp }}/dark-factory/runs/*/transcripts/evidence.log
            !${{ runner.temp }}/dark-factory/runs/*/transcripts/merge-*.log
            !${{ runner.temp }}/dark-factory/runs/*/transcripts/post-merge.log
            !${{ runner.temp }}/dark-factory/runs/*/transcripts/security.log
