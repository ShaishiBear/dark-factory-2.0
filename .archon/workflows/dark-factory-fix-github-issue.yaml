name: dark-factory-fix-github-issue
description: |
  Use when: Dark Factory orchestrator wants to implement an accepted issue in DynaChat
            (Python/FastAPI backend + React/TypeScript frontend).
  Triggers: Orchestrator dispatch when an issue is labeled `factory:accepted`.
  Does: Keeps Cole's orchestration/validation control plane, but runs research,
        specification, context assembly, implementation, review, and repair through
        Matt Pocock's pinned engineering skills. The independent validator remains separate.
  NOT for: Triage (use dark-factory-triage) or PR validation (use dark-factory-validate-pr).

provider: claude
model: sonnet

nodes:
  - id: extract-issue-number
    command: dark-factory-extract-issue-number

  - id: fetch-issue
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      [ -n "$ISSUE_NUM" ] || { echo "Failed to extract issue number" >&2; exit 1; }
      gh issue view "$ISSUE_NUM" --json title,body,labels,comments,state,url,author
    depends_on: [extract-issue-number]
    timeout: 20000

  - id: classify-issue
    command: dark-factory-classify-issue
    depends_on: [fetch-issue]
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type: {type: string, enum: ["bug", "feature", "enhancement", "refactor", "chore", "documentation"]}
        title: {type: string}
        reasoning: {type: string}
      required: [issue_type, title, reasoning]

  - id: engineering-preflight
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      test -f docs/agents/issue-tracker.md
      test -f docs/agents/domain.md
      test -f docs/agents/matt-skills.md
      claude plugin list --json | python -c 'import json,sys; assert "mattpocock-skills" in str(json.load(sys.stdin))' || {
        echo "Pinned Matt Pocock skills plugin is not installed. See docs/agents/matt-skills.md." >&2; exit 1; }
      BLOCKERS=$(gh issue view "$ISSUE_NUM" --json body -q '.body' | grep -oiE '^Blocked by: #[0-9]+' | grep -oE '[0-9]+' || true)
      for b in $BLOCKERS; do
        STATE=$(gh issue view "$b" --json state -q '.state' 2>/dev/null || echo OPEN)
        if [ "$STATE" != "CLOSED" ]; then
          gh issue edit "$ISSUE_NUM" --remove-label factory:accepted --remove-label factory:in-progress 2>/dev/null || true
          echo "FRONTIER_BLOCKED issue=#$ISSUE_NUM blocker=#$b state=$STATE" >&2
          exit 75
        fi
      done
      echo "FRONTIER_READY issue=#$ISSUE_NUM"
    depends_on: [classify-issue]
    timeout: 30000

  - id: web-research
    command: dark-factory-engineering-research
    depends_on: [engineering-preflight]
    skills: [mattpocock-skills:research]
    context: fresh

  - id: investigate
    command: dark-factory-engineering-investigate
    depends_on: [classify-issue, web-research]
    when: "$classify-issue.output.issue_type == 'bug'"
    skills: [mattpocock-skills:diagnosing-bugs, mattpocock-skills:domain-modeling, mattpocock-skills:codebase-design]
    context: fresh

  - id: plan
    command: dark-factory-engineering-plan
    depends_on: [classify-issue, web-research]
    when: "$classify-issue.output.issue_type != 'bug'"
    skills: [mattpocock-skills:to-spec, mattpocock-skills:domain-modeling, mattpocock-skills:codebase-design]
    context: fresh

  - id: bridge-artifacts
    bash: |
      set -euo pipefail
      if [ -f "$ARTIFACTS_DIR/plan.md" ] && [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then cp "$ARTIFACTS_DIR/plan.md" "$ARTIFACTS_DIR/investigation.md";
      elif [ ! -f "$ARTIFACTS_DIR/investigation.md" ]; then echo "No investigation/plan artifact" >&2; exit 1; fi
    depends_on: [investigate, plan]
    trigger_rule: one_success
    timeout: 10000

  - id: compile-contract
    command: dark-factory-engineering-contract
    depends_on: [bridge-artifacts]
    skills: [mattpocock-skills:to-spec, mattpocock-skills:domain-modeling, mattpocock-skills:codebase-design]
    context: fresh

  - id: contract-gate
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      python scripts/factory_protocol.py contract \
        --input "$ARTIFACTS_DIR/task-contract.raw.json" \
        --output "$ARTIFACTS_DIR/task-contract.json" \
        --hash-output "$ARTIFACTS_DIR/task-contract.sha256" --issue "$ISSUE_NUM"
    depends_on: [compile-contract]
    timeout: 15000

  - id: context-assemble
    command: dark-factory-engineering-context
    depends_on: [contract-gate]
    skills: [mattpocock-skills:codebase-design, mattpocock-skills:domain-modeling]
    context: fresh

  - id: context-gate
    bash: |
      set -euo pipefail
      python scripts/factory_protocol.py context \
        --input "$ARTIFACTS_DIR/context.raw.json" \
        --contract "$ARTIFACTS_DIR/task-contract.json" \
        --output "$ARTIFACTS_DIR/context.json"
    depends_on: [context-assemble]
    timeout: 15000

  - id: scope
    command: dark-factory-engineering-scope
    depends_on: [context-gate]
    skills: [mattpocock-skills:to-tickets, mattpocock-skills:codebase-design]
    context: fresh
    output_format:
      type: object
      properties:
        action: {type: string, enum: ["implement", "decompose"]}
        reason: {type: string}
        estimated_change_lines: {type: integer, minimum: 0}
      required: [action, reason, estimated_change_lines]

  - id: decompose
    command: dark-factory-engineering-decompose
    depends_on: [scope]
    when: "$scope.output.action == 'decompose'"
    skills: [mattpocock-skills:to-tickets]
    context: fresh

  - id: test-author
    command: dark-factory-engineering-test-author
    depends_on: [scope]
    when: "$scope.output.action == 'implement'"
    skills: [mattpocock-skills:tdd]
    context: fresh

  - id: red-proof
    bash: |
      set -euo pipefail
      python scripts/factory_proof.py red --spec "$ARTIFACTS_DIR/test-spec.json" --output "$ARTIFACTS_DIR/red-proof.json"
    depends_on: [test-author]
    timeout: 360000

  - id: implement
    command: dark-factory-engineering-implement-proof
    depends_on: [red-proof]
    skills: [mattpocock-skills:implement, mattpocock-skills:tdd, mattpocock-skills:codebase-design, mattpocock-skills:domain-modeling]
    context: fresh

  - id: green-proof
    bash: |
      set -euo pipefail
      python scripts/factory_proof.py green --proof "$ARTIFACTS_DIR/red-proof.json" --output "$ARTIFACTS_DIR/green-proof.json"
    depends_on: [implement]
    timeout: 360000

  - id: validate
    command: dark-factory-validate
    depends_on: [green-proof]
    context: fresh

  - id: create-pr
    command: dark-factory-create-pr
    depends_on: [validate]
    context: fresh

  - id: capture-pr-number
    bash: |
      set -euo pipefail
      if [ -f "$ARTIFACTS_DIR/.pr-number" ]; then PR=$(tr -d ' \n\r' < "$ARTIFACTS_DIR/.pr-number"); else PR=""; fi
      [ -n "$PR" ] || PR=$(gh pr view --json number -q '.number' 2>/dev/null || true)
      [ -n "$PR" ] || { echo "could not determine PR number" >&2; exit 1; }
      echo "$PR" > "$ARTIFACTS_DIR/.pr-number"; echo "$PR"
    depends_on: [create-pr]
    timeout: 15000

  - id: attach-contract
    bash: |
      set -euo pipefail
      python scripts/factory_protocol.py attach --contract "$ARTIFACTS_DIR/task-contract.json" --pr "$capture-pr-number.output"
    depends_on: [capture-pr-number]
    timeout: 20000

  - id: review-scope
    command: dark-factory-pr-review-scope
    depends_on: [attach-contract]
    context: fresh

  - id: review-classify
    command: dark-factory-review-classify
    depends_on: [review-scope]
    model: haiku
    allowed_tools: []
    context: fresh
    output_format:
      type: object
      properties:
        run_code_review: {type: string, enum: ["true", "false"]}
        run_error_handling: {type: string, enum: ["true", "false"]}
        run_test_coverage: {type: string, enum: ["true", "false"]}
        run_comment_quality: {type: string, enum: ["true", "false"]}
        run_docs_impact: {type: string, enum: ["true", "false"]}
        reasoning: {type: string}
      required: [run_code_review, run_error_handling, run_test_coverage, run_comment_quality, run_docs_impact, reasoning]

  - id: code-review
    command: dark-factory-engineering-review
    depends_on: [review-classify]
    skills: [mattpocock-skills:code-review, mattpocock-skills:domain-modeling, mattpocock-skills:codebase-design]
    context: fresh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_error_handling == 'true'"
    context: fresh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_test_coverage == 'true'"
    context: fresh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_comment_quality == 'true'"
    context: fresh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-classify]
    when: "$review-classify.output.run_docs_impact == 'true'"
    context: fresh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  - id: self-fix
    command: dark-factory-engineering-self-fix
    depends_on: [synthesize]
    skills: [mattpocock-skills:diagnosing-bugs, mattpocock-skills:tdd, mattpocock-skills:implement]
    context: fresh

  - id: simplify
    command: archon-simplify-changes
    depends_on: [self-fix]
    skills: [mattpocock-skills:codebase-design]
    context: fresh

  - id: final-green-proof
    bash: |
      set -euo pipefail
      python scripts/factory_proof.py green --proof "$ARTIFACTS_DIR/red-proof.json" --output "$ARTIFACTS_DIR/final-green-proof.json"
    depends_on: [simplify]
    timeout: 360000

  - id: attach-proof
    bash: |
      set -euo pipefail
      python scripts/factory_proof.py attach --proof "$ARTIFACTS_DIR/final-green-proof.json" --pr "$capture-pr-number.output"
    depends_on: [final-green-proof]
    timeout: 20000

  - id: report
    command: archon-issue-completion-report
    depends_on: [attach-proof]
    context: fresh

  - id: cleanup-issue-label
    bash: |
      set -euo pipefail
      ISSUE_NUM=$(echo "$extract-issue-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      [ -z "$ISSUE_NUM" ] || gh issue edit "$ISSUE_NUM" --remove-label "factory:in-progress" 2>&1 || true
    depends_on: [report]
    trigger_rule: all_done
    timeout: 15000
