name: dark-factory-fix-github-issue
description: "Evidence-first builder: compile contract, assemble context, split test/coder authority, prove RED/GREEN, then open PR."
provider: claude
model: sonnet
nodes:
  - id: extract-issue-number
    command: dark-factory-extract-issue-number

  - id: fetch-issue
    bash: |
      set -euo pipefail
      ISSUE=$(echo "$extract-issue-number.output" | tr -d "'\"\\` \n" | grep -oE '[0-9]+' | head -1)
      test -n "$ISSUE"
      echo "$ISSUE" > "$ARTIFACTS_DIR/.issue-number"
      python scripts/factory_contract.py assert-ready "$ISSUE"
      gh issue view "$ISSUE" --json number,title,body,labels,state,url
    depends_on: [extract-issue-number]
    timeout: 30000

  - id: classify
    command: dark-factory-classify-issue
    depends_on: [fetch-issue]
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        issue_type: {type: string, enum: ["bug","feature","enhancement","refactor","chore","documentation"]}
        title: {type: string}
        reasoning: {type: string}
      required: [issue_type,title,reasoning]

  - id: preflight
    bash: |
      set -euo pipefail
      test -f CONTEXT.md
      test -f contracts/task-contract.schema.json
      python -m py_compile scripts/factory_contract.py scripts/factory_tdd.py
      claude plugin list --json | grep -q 'mattpocock-skills'
    depends_on: [classify]
    timeout: 30000

  - id: research
    command: dark-factory-engineering-research
    depends_on: [preflight]
    skills: [mattpocock-skills:research]
    context: fresh

  - id: investigate
    command: dark-factory-engineering-investigate
    depends_on: [classify,research]
    when: "$classify.output.issue_type == 'bug'"
    skills: [mattpocock-skills:diagnosing-bugs,mattpocock-skills:domain-modeling,mattpocock-skills:codebase-design]
    context: fresh

  - id: plan
    command: dark-factory-engineering-plan
    depends_on: [classify,research]
    when: "$classify.output.issue_type != 'bug'"
    skills: [mattpocock-skills:to-spec,mattpocock-skills:domain-modeling,mattpocock-skills:codebase-design]
    context: fresh

  - id: scope
    command: dark-factory-engineering-scope
    depends_on: [investigate,plan]
    trigger_rule: one_success
    skills: [mattpocock-skills:to-tickets,mattpocock-skills:codebase-design]
    context: fresh
    output_format:
      type: object
      properties:
        action: {type: string, enum: ["implement","decompose"]}
        reason: {type: string}
        estimated_change_lines: {type: integer, minimum: 0}
      required: [action,reason,estimated_change_lines]

  - id: decompose
    command: dark-factory-engineering-decompose-v2
    depends_on: [scope]
    when: "$scope.output.action == 'decompose'"
    skills: [mattpocock-skills:to-tickets,mattpocock-skills:codebase-design]
    context: fresh

  - id: reconcile-frontier
    bash: |
      set -euo pipefail
      python scripts/factory_contract.py reconcile
    depends_on: [decompose]
    timeout: 60000

  - id: compile-contract
    command: dark-factory-compile-contract
    depends_on: [scope]
    when: "$scope.output.action == 'implement'"
    skills: [mattpocock-skills:to-spec,mattpocock-skills:domain-modeling,mattpocock-skills:codebase-design]
    allowed_tools: [Read,Write,Bash]
    context: fresh

  - id: contract-gate
    bash: |
      set -euo pipefail
      test -s "$ARTIFACTS_DIR/task-contract.json"
      python scripts/factory_contract.py validate "$ARTIFACTS_DIR/task-contract.json"
      python scripts/factory_contract.py context "$ARTIFACTS_DIR/task-contract.json" "$ARTIFACTS_DIR/context-manifest.json"
      python scripts/factory_tdd.py capture "$ARTIFACTS_DIR/task-contract.json" "$ARTIFACTS_DIR/tdd-state.json"
    depends_on: [compile-contract]
    timeout: 60000

  - id: test-author
    command: dark-factory-test-author
    depends_on: [contract-gate]
    skills: [mattpocock-skills:tdd]
    context: fresh

  - id: red-gate
    bash: |
      set -euo pipefail
      python scripts/factory_tdd.py red "$ARTIFACTS_DIR/task-contract.json" "$ARTIFACTS_DIR/tdd-state.json" "$ARTIFACTS_DIR/red-proof.json"
    depends_on: [test-author]
    timeout: 900000

  - id: coder
    command: dark-factory-coder
    depends_on: [red-gate]
    skills: [mattpocock-skills:implement,mattpocock-skills:tdd,mattpocock-skills:codebase-design,mattpocock-skills:domain-modeling]
    context: fresh

  - id: green-gate
    bash: |
      set -euo pipefail
      python scripts/factory_tdd.py green "$ARTIFACTS_DIR/task-contract.json" "$ARTIFACTS_DIR/tdd-state.json" "$ARTIFACTS_DIR/green-proof.json"
      python harness/ci.py --quick
    depends_on: [coder]
    timeout: 1200000

  - id: create-pr
    command: dark-factory-create-pr
    depends_on: [green-gate]
    context: fresh

  - id: publish-builder-evidence
    bash: |
      set -euo pipefail
      PR=$(gh pr view --json number -q .number)
      HEAD=$(git rev-parse HEAD)
      python - "$ARTIFACTS_DIR" "$HEAD" > "$ARTIFACTS_DIR/builder-evidence.json" <<'PY'
      import hashlib,json,sys,pathlib
      d=pathlib.Path(sys.argv[1]); head=sys.argv[2]
      load=lambda n:json.loads((d/n).read_text())
      c,ctx,r,g=load("task-contract.json"),load("context-manifest.json"),load("red-proof.json"),load("green-proof.json")
      canon=lambda x:json.dumps(x,sort_keys=True,separators=(",",":"),ensure_ascii=False)
      out={"schema_version":"1.0","head_sha":head,"contract":c,
           "contract_sha256":hashlib.sha256(canon(c).encode()).hexdigest(),
           "context_sha256":ctx["manifest_sha256"],"red_proof_sha256":r["proof_sha256"],
           "green_proof_sha256":g["proof_sha256"],"test_sha":r["test_sha"]}
      print(json.dumps(out,sort_keys=True,separators=(",",":")))
      PY
      BODY="<!-- dark-factory-builder-evidence:v1 -->"$'\n```json\n'"$(cat "$ARTIFACTS_DIR/builder-evidence.json")"$'\n```'
      gh pr comment "$PR" --body "$BODY"
      gh pr edit "$PR" --add-label "factory:needs-review"
    depends_on: [create-pr]
    timeout: 30000

  - id: report
    command: archon-issue-completion-report
    depends_on: [publish-builder-evidence,reconcile-frontier]
    trigger_rule: one_success
    context: fresh
